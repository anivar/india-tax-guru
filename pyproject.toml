[project]
name = "india-tax-guru"
version = "0.1.0"
description = "Open-source India income-tax planning, salary-structuring, and ITR-filing-support toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
]

[project.scripts]
itg = "india_tax_guru.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/india_tax_guru"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
