[project]
name = "india-tax-guru"
version = "0.2.1"
description = "Open-source India income-tax planning, salary-structuring, and ITR-filing-support toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anivar Aravind", email = "anivar.aravind@gmail.com" }]
keywords = [
    "india", "income-tax", "itr", "tax-planning", "salary-structuring",
    "capital-gains", "hra", "presumptive", "44ad", "gst", "huf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/anivar/india-tax-guru"
Changelog = "https://github.com/anivar/india-tax-guru/blob/main/CHANGELOG.md"
Issues = "https://github.com/anivar/india-tax-guru/issues"

[project.optional-dependencies]
cli = [
    "click>=8.1",
]

[project.scripts]
itg = "india_tax_guru.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/india_tax_guru"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "click>=8.1",  # the `itg` CLI extra, so tests and local runs exercise it
]
